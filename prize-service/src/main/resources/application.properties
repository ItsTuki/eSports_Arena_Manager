spring.application.name=prize-service
server.port=8090
spring.datasource.url=jdbc:mysql://localhost:3320/db_prizes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
services.tournament.url=${TOURNAMENT_SERVICE_URL:http://localhost:8083}
services.ranking.url=${RANKING_SERVICE_URL:http://localhost:8089}
