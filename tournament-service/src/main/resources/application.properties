spring.application.name=tournament-service
server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/db_tournaments?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
services.game.url=${GAME_SERVICE_URL:http://localhost:8087}
