spring.application.name=sanction-service
server.port=8085
spring.datasource.url=jdbc:mysql://localhost:3317/db_sanctions?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
services.user.url=${USER_SERVICE_URL:http://localhost:8081}
services.team.url=${TEAM_SERVICE_URL:http://localhost:8082}
