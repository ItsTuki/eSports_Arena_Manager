spring:
  application:
    name: result-service
  datasource:
    url: "jdbc:mysql://localhost:3306/db_results?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

server:
  port: 8088

services:
  match:
    url: ${MATCH_SERVICE_URL:http://localhost:8086}
  ranking:
    url: ${RANKING_SERVICE_URL:http://localhost:8089}
  prize:
    url: ${PRIZE_SERVICE_URL:http://localhost:8090}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
