spring.application.name=result-service
server.port=8088
spring.datasource.url=jdbc:mysql://localhost:3318/db_results?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
services.match.url=${MATCH_SERVICE_URL:http://localhost:8086}
services.ranking.url=${RANKING_SERVICE_URL:http://localhost:8089}
services.prize.url=${PRIZE_SERVICE_URL:http://localhost:8090}
