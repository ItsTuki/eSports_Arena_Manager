    // --- 7. VISTA AUTENTICACION (EP3) ---
    function VistaAutenticacion({ setVistaActual, setUsuario }) {
      const [modo, setModo] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [nombre, setNombre] = useState('');
      const [apodo, setApodo] = useState('');
      const [rolRegistro, setRolRegistro] = useState('JUGADOR');
      const [errorMensaje, setErrorMensaje] = useState('');
      const [cargando, setCargando] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setErrorMensaje('');
        const valEmail = validationUtils.validarEmail(email);
        const valPass = validationUtils.validarPassword(password);
        if (!valEmail.valido) { setErrorMensaje(valEmail.mensaje); return; }
        if (!valPass.valido) { setErrorMensaje(valPass.mensaje); return; }

        setCargando(true);
        try {
          if (window.AuthService) {
            const res = await window.AuthService.login(email, password);
            setUsuario(res.user);
            // Redirigir según rol
            if (res.user.rol === 'ADMINISTRADOR') setVistaActual('admin');
            else if (res.user.rol === 'ORGANIZADOR') setVistaActual('organizador');
            else setVistaActual('torneos');
          }
        } catch (err) {
          setErrorMensaje(err.message || 'Error al iniciar sesión.');
        } finally {
          setCargando(false);
        }
      };

      const handleRegistro = async (e) => {
        e.preventDefault();
        setErrorMensaje('');
        const valEmail = validationUtils.validarEmail(email);
        const valPass = validationUtils.validarPassword(password);
        const valApodo = validationUtils.validarApodo(apodo);

        if (!valApodo.valido) { setErrorMensaje(valApodo.mensaje); return; }
        if (!valEmail.valido) { setErrorMensaje(valEmail.mensaje); return; }
        if (!valPass.valido) { setErrorMensaje(valPass.mensaje); return; }

        setCargando(true);
        try {
          if (window.AuthService) {
            await window.AuthService.registro({
              email,
              password,
              nombre: nombre || apodo,
              apodo,
              rol: rolRegistro
            });
            // Auto login tras registro exitoso
            const res = await window.AuthService.login(email, password);
            setUsuario(res.user);
            setVistaActual('torneos');
          }
        } catch (err) {
          setErrorMensaje(err.message || 'Error al registrar cuenta.');
        } finally {
          setCargando(false);
        }
      };

      return (
        <div className="container py-5" style={{ maxWidth: '480px' }}>
          <div className="tarjeta">
            <div className="text-center mb-4">
              <i className="bi bi-controller display-4" style={{ color: 'var(--color-primario)' }}></i>
              <h3 className="text-white mt-2">Acceso a eSports Arena</h3>
              <p className="text-muted small">Microservicio de Autenticación con JWT (Gateway :8070 / auth-service :8081)</p>
            </div>

            <div className="d-flex mb-4 p-1 rounded" style={{ backgroundColor: '#120c22', border: '1px solid var(--color-superficie-borde)' }}>
              <button 
                className={`btn flex-grow-1 ${modo === 'login' ? 'btn-primary-custom text-white' : 'btn-link text-muted text-decoration-none'}`} 
                onClick={() => { setModo('login'); setErrorMensaje(''); }}
              >
                Iniciar Sesión
              </button>
              <button 
                className={`btn flex-grow-1 ${modo === 'registro' ? 'btn-primary-custom text-white' : 'btn-link text-muted text-decoration-none'}`} 
                onClick={() => { setModo('registro'); setErrorMensaje(''); }}
              >
                Registrarse
              </button>
            </div>

            {errorMensaje && (
              <div className="alert alert-danger py-2 px-3 small mb-3 d-flex align-items-center gap-2">
                <i className="bi bi-exclamation-triangle-fill"></i>
                <span>{errorMensaje}</span>
              </div>
            )}

            {modo === 'login' ? (
              <form onSubmit={handleLogin}>
                <div className="campo-formulario">
                  <label className="etiqueta-formulario" htmlFor="email-login">Correo Electrónico</label>
                  <input 
                    type="email" 
                    id="email-login" 
                    className="control-formulario" 
                    placeholder="usuario@arena.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required 
                  />
                </div>

                <div className="campo-formulario">
                  <label className="etiqueta-formulario" htmlFor="pass-login">Contraseña</label>
                  <input 
                    type="password" 
                    id="pass-login" 
                    className="control-formulario" 
                    placeholder="••••••••"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    required 
                  />
                </div>

                <button type="submit" className="boton-primario w-100 py-2 mb-3" disabled={cargando}>
                  {cargando ? 'Autenticando en microservicio...' : 'Entrar a la Plataforma'}
                </button>

                <div className="p-2 rounded bg-dark border border-secondary small text-muted">
                  <strong>Cuentas rápidas de prueba:</strong><br />
                  • Admin: <code>admin@arena.com</code> / pass: <code>123456</code><br />
                  • Organizador: <code>organizador@arena.com</code> / pass: <code>123456</code><br />
                  • Jugador: <code>jugador@arena.com</code> / pass: <code>123456</code>
                </div>
              </form>
            ) : (
              <form onSubmit={handleRegistro}>
                <div className="campo-formulario">
                  <label className="etiqueta-formulario">Nombre Completo</label>
                  <input 
                    type="text" 
                    className="control-formulario" 
                    placeholder="Nombre y Apellido"
                    value={nombre}
                    onChange={(e) => setNombre(e.target.value)}
                    required 
                  />
                </div>

                <div className="campo-formulario">
                  <label className="etiqueta-formulario">Apodo Competitivo</label>
                  <input 
                    type="text" 
                    className="control-formulario" 
                    placeholder="Sin espacios (ej: GamerPro)"
                    value={apodo}
                    onChange={(e) => setApodo(e.target.value)}
                    required 
                  />
                </div>

                <div className="campo-formulario">
                  <label className="etiqueta-formulario">Correo Electrónico</label>
                  <input 
                    type="email" 
                    className="control-formulario" 
                    placeholder="correo@ejemplo.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required 
                  />
                </div>

                <div className="campo-formulario">
                  <label className="etiqueta-formulario">Contraseña</label>
                  <input 
                    type="password" 
                    className="control-formulario" 
                    placeholder="Mínimo 6 caracteres"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    required 
                  />
                </div>

                <div className="campo-formulario">
                  <label className="etiqueta-formulario">Rol Inicial</label>
                  <select className="control-formulario" value={rolRegistro} onChange={(e) => setRolRegistro(e.target.value)}>
                    <option value="JUGADOR">Jugador</option>
                    <option value="ORGANIZADOR">Organizador de Torneos</option>
                  </select>
                </div>

                <button type="submit" className="boton-primario w-100 py-2" disabled={cargando}>
                  {cargando ? 'Creando cuenta en auth-service...' : 'Crear Cuenta y Entrar'}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // --- 8. VISTA PANEL ORGANIZADOR (EP3 - RUTA RESTRINGIDA) ---
    function VistaPanelOrganizador({ usuario }) {
      const [inscripciones, setInscripciones] = useState([]);
      const [partidas, setPartidas] = useState([]);
      const [torneos, setTorneos] = useState([]);
      const [torneoSeleccionadoId, setTorneoSeleccionadoId] = useState('1');
      const [partidaEditando, setPartidaEditando] = useState(null);
      const [puntaje1, setPuntaje1] = useState(0);
      const [puntaje2, setPuntaje2] = useState(0);
      const [ganadorId, setGanadorId] = useState('');
      const [motivoSancion, setMotivoSancion] = useState('');
      const [usuarioSancionId, setUsuarioSancionId] = useState('6');
      const [mensajeExito, setMensajeExito] = useState('');
      const [cargando, setCargando] = useState(false);

      useEffect(() => {
        const cargarDatosOrganizador = async () => {
          try {
            if (window.api) {
              const [tList, insList, pList] = await Promise.all([
                window.api.getTorneos(),
                window.api.getInscripcionesPorTorneo(torneoSeleccionadoId),
                window.api.getPartidas(torneoSeleccionadoId)
              ]);
              setTorneos(tList || []);
              setInscripciones(insList || []);
              setPartidas(pList || []);
            } else {
              setTorneos(window.MockData?.MOCK_TORNEOS || []);
              setInscripciones(window.MockData?.MOCK_INSCRIPCIONES || []);
              setPartidas(window.MockData?.MOCK_PARTIDAS || []);
            }
          } catch (e) {
            setTorneos(window.MockData?.MOCK_TORNEOS || []);
            setInscripciones(window.MockData?.MOCK_INSCRIPCIONES || []);
            setPartidas(window.MockData?.MOCK_PARTIDAS || []);
          }
        };
        cargarDatosOrganizador();
      }, [torneoSeleccionadoId]);

      if (!usuario || (usuario.rol !== 'ORGANIZADOR' && usuario.rol !== 'ADMINISTRADOR')) {
        return (
          <div className="container py-5 text-center">
            <div className="tarjeta max-w-md mx-auto py-5">
              <i className="bi bi-shield-x display-3 text-danger mb-3 d-block"></i>
              <h3 className="text-white">Acceso Restringido (403 Forbidden)</h3>
              <p className="text-muted">Esta ruta es exclusiva para Organizadores y Administradores de la arena.</p>
            </div>
          </div>
        );
      }

      const handleAprobarInscripcion = async (id) => {
        try {
          if (window.api) {
            await window.api.cambiarEstadoInscripcion(id, 'APROBADA');
          }
          const ins = inscripciones.find(i => i.id === id);
          if (ins) ins.estado = 'APROBADA';
          setInscripciones([...inscripciones]);
          setMensajeExito(`Inscripción #${id} aprobada con éxito en registration-service.`);
          setTimeout(() => setMensajeExito(''), 3000);
        } catch (err) {
          setMensajeExito(`Error al actualizar estado: ${err.message}`);
        }
      };

      const handleAbrirResultado = (partida) => {
        setPartidaEditando(partida);
        setPuntaje1(partida.puntaje1 || 0);
        setPuntaje2(partida.puntaje2 || 0);
        setGanadorId(partida.ganadorId ? String(partida.ganadorId) : (partida.participante1Id ? String(partida.participante1Id) : ''));
      };

      const handleGuardarResultado = async (e) => {
        e.preventDefault();
        if (!partidaEditando) return;
        if (puntaje1 < 0 || puntaje2 < 0) {
          alert('Los puntajes no pueden ser negativos.');
          return;
        }

        const gId = Number(ganadorId);
        const gNombre = gId === partidaEditando.participante1Id ? partidaEditando.participante1Nombre : partidaEditando.participante2Nombre;

        setCargando(true);
        try {
          if (window.api) {
            // Actualizar partida en match-service
            await window.api.actualizarPartida(partidaEditando.id, {
              puntaje1: Number(puntaje1),
              puntaje2: Number(puntaje2),
              ganadorId: gId,
              ganadorNombre: gNombre,
              estado: 'FINALIZADA',
              resultadoValidado: true
            });
            // Guardar resultado oficial en result-service
            await window.api.crearResultado({
              partidaId: partidaEditando.id,
              ganadorId: gId,
              puntajeA: Number(puntaje1),
              puntajeB: Number(puntaje2),
              evidencia: 'Validado por Organizador en Panel',
              partidaExiste: true
            });
          }

          partidaEditando.puntaje1 = Number(puntaje1);
          partidaEditando.puntaje2 = Number(puntaje2);
          partidaEditando.ganadorId = gId;
          partidaEditando.ganadorNombre = gNombre;
          partidaEditando.estado = 'FINALIZADA';
          partidaEditando.resultadoValidado = true;

          setPartidas([...partidas]);
          setPartidaEditando(null);
          setMensajeExito(`Resultado de Partida #${partidaEditando.id} validado en match-service y result-service.`);
          setTimeout(() => setMensajeExito(''), 3500);
        } catch (err) {
          alert(`Error al guardar resultado: ${err.message}`);
        } finally {
          setCargando(false);
        }
      };

      const handleAplicarSancion = async (e) => {
        e.preventDefault();
        if (!motivoSancion) return;

        const nueva = {
          usuarioId: Number(usuarioSancionId),
          usuarioApodo: 'Shadow',
          motivo: motivoSancion,
          fechaInicio: new Date().toISOString(),
          fechaFin: new Date(Date.now() + 7 * 86400000).toISOString(),
          estado: 'ACTIVA',
          activa: true
        };

        try {
          if (window.api) {
            await window.api.crearSancion(nueva);
          } else {
            window.MockData.MOCK_SANCIONES.push({ id: Date.now(), ...nueva });
          }
          setMotivoSancion('');
          setMensajeExito(`Sanción disciplinaria enviada a sanction-service para usuario #${usuarioSancionId}.`);
          setTimeout(() => setMensajeExito(''), 3500);
        } catch (err) {
          alert(`Error al aplicar sanción: ${err.message}`);
        }
      };

      return (
        <div className="container py-4">
          <div className="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
              <span className="badge bg-warning text-dark mb-1"><i className="bi bi-speedometer2"></i> Rol: {usuario.rol}</span>
              <h2 className="text-white mb-0">Panel de Operaciones del Organizador</h2>
            </div>
            <div className="d-flex align-items-center gap-2">
              <label className="text-muted small mb-0">Torneo en Operación:</label>
              <select className="control-formulario py-1" style={{ width: '220px' }} value={torneoSeleccionadoId} onChange={(e) => setTorneoSeleccionadoId(e.target.value)}>
                {torneos.map(t => (
                  <option key={t.id} value={t.id}>{t.nombre} ({t.estado})</option>
                ))}
              </select>
            </div>
          </div>

          {mensajeExito && (
            <div className="alert alert-success py-2 px-3 small mb-4">
              <i className="bi bi-check-circle-fill me-1"></i> {mensajeExito}
            </div>
          )}

          <div className="row g-4 mb-4">
            {/* Bandeja de Inscripciones */}
            <div className="col-lg-6">
              <div className="tarjeta h-100">
                <h5 className="text-white mb-3"><i className="bi bi-inbox me-2" style={{ color: 'var(--color-acento)' }}></i> Bandeja de Inscripciones</h5>
                <div className="table-responsive">
                  <table className="tabla-esports">
                    <thead>
                      <tr>
                        <th>Participante</th>
                        <th>Estado</th>
                        <th className="text-end">Acción</th>
                      </tr>
                    </thead>
                    <tbody>
                      {inscripciones.map(ins => (
                        <tr key={ins.id}>
                          <td>
                            <strong>{ins.participanteNombre}</strong>
                            <div className="small text-muted">Torneo #{ins.torneoId}</div>
                          </td>
                          <td>
                            <span className={`badge ${ins.estado === 'APROBADA' ? 'bg-success' : 'bg-warning text-dark'}`}>
                              {ins.estado}
                            </span>
                          </td>
                          <td className="text-end">
                            {ins.estado !== 'APROBADA' ? (
                              <button className="btn btn-sm btn-success py-0 px-2" onClick={() => handleAprobarInscripcion(ins.id)}>
                                Aprobar
                              </button>
                            ) : (
                              <span className="text-muted small"><i className="bi bi-check"></i> Listo</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            {/* Aplicar Sanción */}
            <div className="col-lg-6">
              <div className="tarjeta h-100">
                <h5 className="text-white mb-3"><i className="bi bi-shield-slash me-2 text-danger"></i> Aplicar Sanción Disciplinaria</h5>
                <form onSubmit={handleAplicarSancion}>
                  <div className="campo-formulario">
                    <label className="etiqueta-formulario">ID Usuario Infractor</label>
                    <input 
                      type="number" 
                      className="control-formulario" 
                      value={usuarioSancionId} 
                      onChange={(e) => setUsuarioSancionId(e.target.value)} 
                      required 
                    />
                  </div>
                  <div className="campo-formulario">
                    <label className="etiqueta-formulario">Motivo de la Sanción</label>
                    <input 
                      type="text" 
                      className="control-formulario" 
                      placeholder="Ej: Inasistencia injustificada a partida oficial" 
                      value={motivoSancion} 
                      onChange={(e) => setMotivoSancion(e.target.value)} 
                      required 
                    />
                  </div>
                  <button type="submit" className="boton-peligro w-100 py-2">
                    <i className="bi bi-exclamation-octagon me-1"></i> Confirmar y Aplicar Sanción
                  </button>
                </form>
              </div>
            </div>
          </div>

          {/* Registro y Validación de Resultados */}
          <div className="tarjeta">
            <h5 className="text-white mb-3"><i className="bi bi-trophy me-2" style={{ color: 'var(--color-primario)' }}></i> Registro y Validación de Partidas</h5>
            <div className="table-responsive">
              <table className="tabla-esports">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Ronda</th>
                    <th>Enfrentamiento</th>
                    <th>Marcador</th>
                    <th>Estado</th>
                    <th className="text-end">Operación</th>
                  </tr>
                </thead>
                <tbody>
                  {partidas.map(p => (
                    <tr key={p.id}>
                      <td>#{p.id}</td>
                      <td>Ronda {p.ronda}</td>
                      <td>{p.participante1Nombre || 'TBD'} vs {p.participante2Nombre || 'TBD'}</td>
                      <td><strong style={{ color: 'var(--color-acento)' }}>{p.puntaje1 || 0} - {p.puntaje2 || 0}</strong></td>
                      <td>
                        {p.resultadoValidado ? (
                          <span className="badge bg-success"><i className="bi bi-check2"></i> Validado</span>
                        ) : (
                          <span className="badge bg-warning text-dark">Pendiente</span>
                        )}
                      </td>
                      <td className="text-end">
                        {!p.resultadoValidado && p.participante1Nombre && p.participante2Nombre ? (
                          <button className="boton-acento py-1 px-2" style={{ fontSize: '12px' }} onClick={() => handleAbrirResultado(p)}>
                            Registrar Marcador
                          </button>
                        ) : (
                          <span className="text-muted small">Cerrada</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Modal / Formulario de Registro de Resultado */}
          {partidaEditando && (
            <div className="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style={{ backgroundColor: 'rgba(0,0,0,0.75)', zIndex: 2000 }}>
              <div className="tarjeta p-4" style={{ width: '460px', maxWidth: '90%' }}>
                <h4 className="text-white mb-3">Registrar Marcador: Partida #{partidaEditando.id}</h4>
                <form onSubmit={handleGuardarResultado}>
                  <div className="row g-3 mb-3">
                    <div className="col-6">
                      <label className="etiqueta-formulario">{partidaEditando.participante1Nombre}</label>
                      <input type="number" min="0" className="control-formulario" value={puntaje1} onChange={(e) => setPuntaje1(e.target.value)} required />
                    </div>
                    <div className="col-6">
                      <label className="etiqueta-formulario">{partidaEditando.participante2Nombre}</label>
                      <input type="number" min="0" className="control-formulario" value={puntaje2} onChange={(e) => setPuntaje2(e.target.value)} required />
                    </div>
                  </div>

                  <div className="campo-formulario">
                    <label className="etiqueta-formulario">Ganador Oficial de la Partida</label>
                    <select className="control-formulario" value={ganadorId} onChange={(e) => setGanadorId(e.target.value)}>
                      <option value={partidaEditando.participante1Id}>{partidaEditando.participante1Nombre}</option>
                      <option value={partidaEditando.participante2Id}>{partidaEditando.participante2Nombre}</option>
                    </select>
                  </div>

                  <div className="d-flex gap-2 mt-4">
                    <button type="button" className="boton-secundario flex-grow-1" onClick={() => setPartidaEditando(null)}>Cancelar</button>
                    <button type="submit" className="boton-primario flex-grow-1" disabled={cargando}>
                      {cargando ? 'Validando...' : 'Validar Resultado'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- 9. VISTA PANEL ADMIN (EP3 - RUTA RESTRINGIDA) ---
    function VistaPanelAdmin({ usuario }) {
      const [juegos, setJuegos] = useState([]);
      const [torneos, setTorneos] = useState([]);
      const [nombreJuego, setNombreJuego] = useState('');
      const [categoriaJuego, setCategoriaJuego] = useState('Tactical Shooter');
      const [minIntegrantes, setMinIntegrantes] = useState(5);
      const [nombreTorneo, setNombreTorneo] = useState('');
      const [torneoJuegoId, setTorneoJuegoId] = useState('1');
      const [cupoMaximo, setCupoMaximo] = useState(16);
      const [fechaInicio, setFechaInicio] = useState('2026-10-01');
      const [fechaCierre, setFechaCierre] = useState('2026-09-28');
      const [mensajeExito, setMensajeExito] = useState('');
      const [cargando, setCargando] = useState(false);

      useEffect(() => {
        const cargarAdminDatos = async () => {
          try {
            if (window.api) {
              const [jList, tList] = await Promise.all([
                window.api.getJuegos(true),
                window.api.getTorneos()
              ]);
              setJuegos(jList || []);
              setTorneos(tList || []);
            } else {
              setJuegos(window.MockData?.MOCK_JUEGOS || []);
              setTorneos(window.MockData?.MOCK_TORNEOS || []);
            }
          } catch {
            setJuegos(window.MockData?.MOCK_JUEGOS || []);
            setTorneos(window.MockData?.MOCK_TORNEOS || []);
          }
        };
        cargarAdminDatos();
      }, []);

      if (!usuario || usuario.rol !== 'ADMINISTRADOR') {
        return (
          <div className="container py-5 text-center">
            <div className="tarjeta max-w-md mx-auto py-5">
              <i className="bi bi-shield-lock display-3 text-danger mb-3 d-block"></i>
              <h3 className="text-white">Acceso Restringido (403 Forbidden)</h3>
              <p className="text-muted">Esta ruta es exclusiva para Administradores del sistema.</p>
            </div>
          </div>
        );
      }

      const handleCrearJuego = async (e) => {
        e.preventDefault();
        if (!nombreJuego) return;
        setCargando(true);
        const payload = {
          nombre: nombreJuego.trim(),
          categoria: categoriaJuego,
          minimoPorEquipo: Number(minIntegrantes),
          tamanoEquipo: Number(minIntegrantes),
          descripcion: 'Juego habilitado para torneos oficiales.',
          activo: true
        };

        try {
          let nuevo;
          if (window.api) {
            nuevo = await window.api.crearJuego(payload);
          } else {
            nuevo = { id: Date.now(), ...payload };
            window.MockData.MOCK_JUEGOS.push(nuevo);
          }
          setJuegos([...juegos, nuevo]);
          setNombreJuego('');
          setMensajeExito(`Juego ${nuevo.nombre} agregado al catálogo oficial de game-service.`);
          setTimeout(() => setMensajeExito(''), 3500);
        } catch (err) {
          alert(`Error al registrar juego: ${err.message}`);
        } finally {
          setCargando(false);
        }
      };

      const handleCrearTorneo = async (e) => {
        e.preventDefault();
        if (!nombreTorneo) return;
        if (new Date(fechaInicio).getTime() <= new Date(fechaCierre).getTime()) {
          alert('La fecha de inicio debe ser posterior al cierre de inscripción.');
          return;
        }

        const jObj = juegos.find(j => String(j.id) === String(torneoJuegoId));
        const payload = {
          nombre: nombreTorneo.trim(),
          juegoId: Number(torneoJuegoId),
          juegoNombre: jObj?.nombre || 'Juego Competitivo',
          cupoMaximo: Number(cupoMaximo),
          cuposOcupados: 0,
          fechaInicio: `${fechaInicio}T18:00:00`,
          fechaFin: `${fechaInicio}T23:00:00`,
          fechaCierreInscripcion: `${fechaCierre}T23:59:59`,
          modalidad: jObj?.minimoPorEquipo === 1 ? 'INDIVIDUAL' : 'EQUIPO',
          estado: 'ABIERTO',
          premioTotal: '$1,000,000 CLP'
        };

        setCargando(true);
        try {
          let nuevo;
          if (window.api) {
            nuevo = await window.api.crearTorneo(payload);
          } else {
            nuevo = { id: Date.now(), ...payload };
            window.MockData.MOCK_TORNEOS.push(nuevo);
          }
          setTorneos([...torneos, nuevo]);
          setNombreTorneo('');
          setMensajeExito(`Torneo ${nuevo.nombre} creado con éxito en tournament-service.`);
          setTimeout(() => setMensajeExito(''), 3500);
        } catch (err) {
          alert(`Error al registrar torneo: ${err.message}`);
        } finally {
          setCargando(false);
        }
      };

      return (
        <div className="container py-4">
          <div className="d-flex justify-content-between align-items-center mb-4">
            <div>
              <span className="badge bg-danger mb-1"><i className="bi bi-shield-lock-fill"></i> Nivel Máximo: {usuario.rol}</span>
              <h2 className="text-white mb-0">Panel de Administración General</h2>
            </div>
          </div>

          {mensajeExito && (
            <div className="alert alert-success py-2 px-3 small mb-4">
              <i className="bi bi-check-circle-fill me-1"></i> {mensajeExito}
            </div>
          )}

          <div className="row g-4 mb-4">
            {/* Mantenedor de Juegos */}
            <div className="col-lg-6">
              <div className="tarjeta h-100">
                <h4 className="text-white mb-3"><i className="bi bi-controller me-2" style={{ color: 'var(--color-primario)' }}></i> Mantenedor de Juegos (game-service)</h4>
                <form onSubmit={handleCrearJuego} className="mb-4">
                  <div className="campo-formulario">
                    <label className="etiqueta-formulario">Nombre del Título</label>
                    <input type="text" className="control-formulario" placeholder="Ej: CS2, Valorant, Dota 2..." value={nombreJuego} onChange={(e) => setNombreJuego(e.target.value)} required />
                  </div>
                  <div className="row g-2 mb-3">
                    <div className="col-6">
                      <label className="etiqueta-formulario">Categoría</label>
                      <input type="text" className="control-formulario" value={categoriaJuego} onChange={(e) => setCategoriaJuego(e.target.value)} />
                    </div>
                    <div className="col-6">
                      <label className="etiqueta-formulario">Min. Integrantes</label>
                      <input type="number" min="1" max="10" className="control-formulario" value={minIntegrantes} onChange={(e) => setMinIntegrantes(e.target.value)} />
                    </div>
                  </div>
                  <button type="submit" className="boton-primario w-100 py-2" disabled={cargando}>
                    {cargando ? 'Guardando...' : 'Registrar Juego'}
                  </button>
                </form>

                <h6 className="text-white mb-2">Juegos Habilitados ({juegos.length}):</h6>
                <div className="d-flex flex-column gap-2" style={{ maxHeight: '200px', overflowY: 'auto' }}>
                  {juegos.map(j => (
                    <div key={j.id} className="p-2 rounded d-flex justify-content-between align-items-center" style={{ backgroundColor: '#120c22' }}>
                      <span className="text-white">{j.nombre} ({j.minimoPorEquipo || 1}v{j.minimoPorEquipo || 1})</span>
                      <span className="badge bg-success">Activo</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Crear Torneo */}
            <div className="col-lg-6">
              <div className="tarjeta h-100">
                <h4 className="text-white mb-3"><i className="bi bi-trophy-fill me-2" style={{ color: 'var(--color-acento)' }}></i> Crear Torneo (tournament-service)</h4>
                <form onSubmit={handleCrearTorneo}>
                  <div className="campo-formulario">
                    <label className="etiqueta-formulario">Nombre del Torneo</label>
                    <input type="text" className="control-formulario" placeholder="Ej: Copa Apertura 2026" value={nombreTorneo} onChange={(e) => setNombreTorneo(e.target.value)} required />
                  </div>

                  <div className="row g-2 mb-3">
                    <div className="col-6">
                      <label className="etiqueta-formulario">Juego</label>
                      <select className="control-formulario" value={torneoJuegoId} onChange={(e) => setTorneoJuegoId(e.target.value)}>
                        {juegos.map(j => <option key={j.id} value={j.id}>{j.nombre}</option>)}
                      </select>
                    </div>
                    <div className="col-6">
                      <label className="etiqueta-formulario">Cupo Máximo</label>
                      <input type="number" min="2" max="128" className="control-formulario" value={cupoMaximo} onChange={(e) => setCupoMaximo(e.target.value)} required />
                    </div>
                  </div>

                  <div className="row g-2 mb-3">
                    <div className="col-6">
                      <label className="etiqueta-formulario">Cierre Inscripciones</label>
                      <input type="date" className="control-formulario" value={fechaCierre} onChange={(e) => setFechaCierre(e.target.value)} required />
                    </div>
                    <div className="col-6">
                      <label className="etiqueta-formulario">Fecha Inicio Partidas</label>
                      <input type="date" className="control-formulario" value={fechaInicio} onChange={(e) => setFechaInicio(e.target.value)} required />
                    </div>
                  </div>

                  <button type="submit" className="boton-primario w-100 py-2" disabled={cargando}>
                    {cargando ? 'Publicando...' : 'Publicar Torneo Oficial'}
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- APP PRINCIPAL CON ENRUTAMIENTO DE CLIENTE ---
    function App() {
      const [vistaActual, setVistaActual] = useState('inicio');
      const [torneoSeleccionadoId, setTorneoSeleccionadoId] = useState(1);
      const [usuario, setUsuario] = useState(null);
      const [apiOnline, setApiOnline] = useState(false);

      const checkBackendStatus = useCallback(async () => {
        if (window.api) {
          const isAlive = await window.api.checkHealth();
          setApiOnline(!!isAlive);
        }
      }, []);

      useEffect(() => {
        let timer;
        const inicializar = async () => {
          let attempts = 0;
          while (!window.api && attempts < 10) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
          }
          if (window.AuthService) {
            const user = window.AuthService.getCurrentUser();
            if (user) setUsuario(user);
          }
          await checkBackendStatus();
        };

        inicializar();
        timer = setInterval(checkBackendStatus, 3000);
        return () => clearInterval(timer);
      }, [checkBackendStatus]);

      const irAInscripcion = (id) => {
        setTorneoSeleccionadoId(id);
        setVistaActual('inscripcion');
      };

      return (
        <div className="d-flex flex-column min-vh-100">
          <Cabecera 
            vistaActual={vistaActual} 
            setVistaActual={setVistaActual} 
            usuario={usuario} 
            setUsuario={setUsuario} 
            apiOnline={apiOnline}
            checkApiStatus={checkBackendStatus}
          />

          <main className="flex-grow-1">
            {vistaActual === 'inicio' && (
              <VistaInicio 
                setVistaActual={setVistaActual} 
                onSeleccionarTorneo={setTorneoSeleccionadoId} 
              />
            )}
            {vistaActual === 'torneos' && (
              <VistaListadoTorneos 
                setVistaActual={setVistaActual} 
                onSeleccionarTorneo={setTorneoSeleccionadoId} 
              />
            )}
            {vistaActual === 'detalle' && (
              <VistaDetalleTorneo 
                torneoId={torneoSeleccionadoId} 
                setVistaActual={setVistaActual} 
                onInscribir={irAInscripcion} 
              />
            )}
            {vistaActual === 'inscripcion' && (
              <VistaInscripcionTorneo 
                torneoId={torneoSeleccionadoId} 
                setVistaActual={setVistaActual} 
                usuario={usuario} 
              />
            )}
            {vistaActual === 'equipos' && (
              <VistaGestionEquipo usuario={usuario} />
            )}
            {vistaActual === 'perfil' && (
              <VistaPerfilJugador usuario={usuario} />
            )}
            {vistaActual === 'auth' && (
              <VistaAutenticacion 
                setVistaActual={setVistaActual} 
                setUsuario={setUsuario} 
              />
            )}
            {vistaActual === 'organizador' && (
              <VistaPanelOrganizador usuario={usuario} />
            )}
            {vistaActual === 'admin' && (
              <VistaPanelAdmin usuario={usuario} />
            )}
          </main>

          <PieDePagina />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
